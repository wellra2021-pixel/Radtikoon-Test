<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เกมเปิดแผ่นป้าย 155 ป้าย</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f0f2f5;
            padding: 20px;
            text-align: center;
        }

        h1 {
            color: #1a73e8;
            margin-bottom: 20px;
        }

        /* จัดตารางแผ่นป้าย */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(85px, 1fr));
            gap: 10px;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* ตัวการ์ด 3D */
        .card {
            background-color: transparent;
            width: 100%;
            height: 85px;
            perspective: 1000px;
            cursor: pointer;
        }

        .card.disabled {
            cursor: default;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s;
            transform-style: preserve-3d;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        /* แอคชันพลิกป้าย */
        .card.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* ด้านหน้าป้าย (รูปภาพ) */
        .card-front {
            background-color: #fff;
            border: 2px solid #ddd;
        }

        .card-front img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* ด้านหลังป้าย (ตัวเลขสุ่ม 1-155) */
        .card-back {
            background: linear-gradient(135deg, #ff4e50, #f9d423);
            color: white;
            font-size: 24px;
            font-weight: bold;
            border: 2px solid #fff;
            transform: rotateY(180deg);
            text-shadow: 1px 1px 3px rgba(0,0,0,0.4);
        }
    </style>
</head>
<body>

    <h1>เกมเปิดแผ่นป้าย</h1>

    <div class="grid-container" id="gridContainer"></div>

    <script>
        const TOTAL_CARDS = 155;
        let shuffledNumbers = [];

        // =========================================================================
        //  วางชื่อไฟล์รูปภาพหรือลิงก์รูปภาพ 155 รูปของคุณในอาร์เรย์ด้านล่างนี้
        // =========================================================================
        const customImages = [
            // "images/1.jpg", "images/2.jpg", ...
        ];

        function getImageUrl(index) {
            if (customImages[index] && customImages[index] !== "") {
                return customImages[index];
            }
            return `images/${index + 1}.jpg`;
        }

        // =========================================================================
        //  ระบบสุ่มตัวเลข 1-155 ไม่ให้ซ้ำกัน (Fisher-Yates Shuffle Algorithm)
        // =========================================================================
        function generateShuffledNumbers() {
            shuffledNumbers = Array.from({length: TOTAL_CARDS}, (_, i) => i + 1);
            
            for (let i = shuffledNumbers.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffledNumbers[i], shuffledNumbers[j]] = [shuffledNumbers[j], shuffledNumbers[i]];
            }
        }

        // =========================================================================
        //  ระบบสร้างเสียงเอฟเฟกต์ (Web Audio API)
        // =========================================================================
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function playFlipSound() {
            if (!audioCtx) {
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'sine';
            osc.frequency.setValueAtTime(400, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.08);

            gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + 0.08);
        }

        // =========================================================================
        //  สร้างกระดานแผ่นป้าย
        // =========================================================================
        function createBoard() {
            const container = document.getElementById('gridContainer');
            container.innerHTML = '';

            for (let i = 0; i < TOTAL_CARDS; i++) {
                const randomNumber = shuffledNumbers[i]; // ตัวเลขสุ่มประจำป้ายนี้

                const card = document.createElement('div');
                card.className = 'card';

                // คลิกเปิดป้าย และล็อกห้ามเปิดซ้ำ
                card.onclick = function() {
                    if (!card.classList.contains('flipped')) {
                        playFlipSound();
                        card.classList.add('flipped', 'disabled');
                    }
                };

                const cardInner = document.createElement('div');
                cardInner.className = 'card-inner';

                // หน้าป้าย (รูปภาพ)
                const cardFront = document.createElement('div');
                cardFront.className = 'card-front';
                const img = document.createElement('img');
                img.src = getImageUrl(i);
                img.alt = `Photo ${i + 1}`;
                
                img.onerror = function() {
                    this.src = `https://picsum.photos/id/${(i % 50) + 10}/200/200`;
                };
                cardFront.appendChild(img);

                // หลังป้าย (ตัวเลขสุ่ม 1-155)
                const cardBack = document.createElement('div');
                cardBack.className = 'card-back';
                cardBack.innerText = randomNumber;

                cardInner.appendChild(cardFront);
                cardInner.appendChild(cardBack);
                card.appendChild(cardInner);
                container.appendChild(card);
            }
        }

        // เริ่มต้นเกมเมื่อเปิดหน้าเว็บ
        generateShuffledNumbers();
        createBoard();
    </script>
</body>
</html>
